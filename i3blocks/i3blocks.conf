[weather]
command=./weather/weather
interval=600
markup=pango
LABEL=WEATHER

[cpu]
command=./stats/sysinfo cpu
interval=5
LABEL=CPU

[ram]
command=./stats/sysinfo ram
interval=5
LABEL=RAM

[volume]
command=echo "VOL: $(pactl get-sink-volume @DEFAULT_SINK@ | awk '{print $5}')"
interval=1

[battery]
command=./stats/sysinfo bat
interval=60
markup=pango
LABEL=BAT

[wifi]
command=./wifi.sh
interval=30
INTERFACE=wlan0
LABEL=WIFI

[time]
command=./date.sh
interval=60
LABEL=TIME
